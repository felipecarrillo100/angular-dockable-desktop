# Builds the demo and publishes it to GitHub Pages on each push to main.
#
# The demo is built with a base href of the repository's Pages path, so it runs under
# https://<owner>.github.io/angular-dockable-desktop/. Written, not yet run remotely (ADR 0010).
name: Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx ng build angular-dockable-desktop
      - run: npx ng build demo --base-href "/${{ github.event.repository.name }}/"
      # A single-page app on Pages: unknown paths fall back to the app.
      - run: cp dist/demo/browser/index.html dist/demo/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/demo/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
