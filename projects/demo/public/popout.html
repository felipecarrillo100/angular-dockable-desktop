<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- The page a pop-out window opens (1.12.0). It needs nothing but a body: the library copies
         the app's styles in and moves the panel into it. Its title shows until the panel's replaces it.
         The demo gives it as popoutUrl="popout.html", relative, so it resolves against the <base href>
         and works under any --base-href (GitHub Pages). -->
    <title>angular-dockable-desktop demo</title>
    <!-- The demo's favicon, as on its main page: the reason to give a pop-out a page of its own.
         Relative to this page, which the build puts beside it. -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body></body>
</html>
